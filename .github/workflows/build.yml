name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find and Build
        run: |
          # Find the directory containing pubspec.yaml
          PUB_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$PUB_DIR" ]; then
            echo "Error: pubspec.yaml not found!"
            exit 1
          fi
          echo "Found project directory: $PUB_DIR"
          cd "$PUB_DIR"
          flutter pub get
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/app/outputs/flutter-apk/*.apk"
